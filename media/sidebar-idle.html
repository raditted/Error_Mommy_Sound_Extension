<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mommy Says</title>
  <style>
    body {
      /* background: var(--vscode-sideBar-background); */
      color: var(--vscode-sideBar-foreground, var(--vscode-editor-foreground));
      font-family: var(--vscode-font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 12px;
      box-sizing: border-box;
      text-align: center;
    }

    .character-image {
      width: 100%;
      max-width: 220px;
      border-radius: 10px;
      box-shadow: 0 4px 12px rgba(255, 105, 180, 0.1);
      margin-bottom: 16px;
      opacity: 0.7;
    }

    .idle-message {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.1em;
      color: #ff85a2;
      font-style: italic;
      opacity: 0.7;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <!-- <img src="{{IMAGE_URI}}" class="character-image" alt="Mommy Character" /> -->
  <div class="idle-message"><br>Run something error or exception, and see what happens~</div>
</body>
</html>
