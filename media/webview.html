<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mommy Says</title>
  <style>
    body {
      background: linear-gradient(135deg, var(--vscode-editor-background) 0%, rgba(255, 182, 193, 0.1) 100%);
      color: var(--vscode-editor-foreground);
      font-family: var(--vscode-font-family);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .container {
      animation: fadeIn 0.8s ease-out forwards;
      max-width: 600px;
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 105, 180, 0.2);
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }

    .character-image {
      max-width: 300px;
      box-shadow: 0 4px 15px rgba(255, 105, 180, 0.15);
      margin-bottom: 20px;
    }

    .message {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.4em;
      color: #ff85a2;
      margin-bottom: 25px;
      line-height: 1.4;
      font-style: italic;
    }

    .error-details {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 0.85em;
      background-color: var(--vscode-editor-inactiveSelectionBackground);
      padding: 15px;
      border-radius: 6px;
      text-align: left;
      overflow-x: auto;
      overflow-y: auto;
      max-height: 250px;
      white-space: pre-wrap;
      word-break: break-word;
      border-left: 4px solid #ff85a2;
      color: var(--vscode-editor-foreground);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="{{IMAGE_URI}}" class="character-image" alt="Mommy Character" />
    <div class="message">"{{MESSAGE}}"</div>
    <div class="error-details">{{ERROR_DETAILS}}</div>
  </div>
</body>
</html>
